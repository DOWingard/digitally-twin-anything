name: dta-storage-spike

services:
  dolt:
    image: dolthub/dolt-sql-server:2.7.3
    environment:
      DOLT_ROOT_PASSWORD: ${SPIKE_DOLT_ROOT_PASSWORD:?SPIKE_DOLT_ROOT_PASSWORD is required}
      DOLT_ROOT_HOST: "%"
    ports:
      - "127.0.0.1:${SPIKE_DOLT_PORT:?SPIKE_DOLT_PORT is required}:3306"
    volumes:
      - dolt-data:/var/lib/dolt

  terminusdb:
    image: terminusdb/terminusdb-server:v12.0.9
    environment:
      TERMINUSDB_ADMIN_PASS: ${SPIKE_TERMINUS_ADMIN_PASS:?SPIKE_TERMINUS_ADMIN_PASS is required}
      TERMINUSDB_SERVER_PORT: "6363"
    ports:
      - "127.0.0.1:${SPIKE_TERMINUS_PORT:?SPIKE_TERMINUS_PORT is required}:6363"
    volumes:
      - terminus-data:/app/terminusdb/storage

volumes:
  dolt-data: {}
  terminus-data: {}
