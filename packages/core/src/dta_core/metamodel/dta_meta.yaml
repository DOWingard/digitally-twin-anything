id: https://w3id.org/dta/meta
name: dta_meta
description: >-
  Types present in every twin. They record the twin's own configuration and
  activity as objects of the graph, so the commit history covers them too.
  A domain ontology must not define a class whose name starts with Twin.
prefixes:
  linkml: https://w3id.org/linkml/
  dta: https://w3id.org/dta/meta/
default_prefix: dta
default_range: string
imports:
  - linkml:types

classes:
  TwinManifest:
    description: >-
      The manifest the twin was built from. There is one such object; each
      revision of the manifest is a new version of it.
    attributes:
      uid:
        identifier: true
        required: true
      twin_id:
        required: true
      name: {}
      tier: {}
      revision:
        range: integer
        required: true
        minimum_value: 1
      manifest_hash:
        required: true
        pattern: "^[0-9a-f]{64}$"
      contract_hash:
        required: true
        pattern: "^[0-9a-f]{64}$"
      content:
        required: true
        description: The whole manifest as YAML.
        annotations:
          dta_long: true

  TwinSource:
    description: A data source the twin reads.
    attributes:
      uid:
        identifier: true
        required: true
      connector:
        required: true
        description: How the source is read (file, sql, http, custom).
      description: {}
      location:
        description: Address of the source with placeholders in place of anything secret.
        annotations:
          dta_long: true
      watermark:
        range: datetime
        description: Latest data timestamp read from the source.
        annotations:
          dta_role: state
      status:
        range: TwinSourceStatus
        required: true
        annotations:
          dta_role: state
      last_success_at:
        range: datetime
        description: Data time of the last successful read.
        annotations:
          dta_role: state
      last_error:
        annotations:
          dta_role: state
          dta_long: true

  TwinDataset:
    description: One dataset of a source and how far the twin has read it.
    attributes:
      uid:
        identifier: true
        required: true
      source:
        range: TwinSource
        required: true
      name:
        required: true
      cursor_column: {}
      cursor:
        description: Highest value of the cursor column read so far, as text.
        annotations:
          dta_role: state
      rows_read:
        range: integer
        minimum_value: 0
        description: Rows read from the dataset since the twin was installed.
        annotations:
          dta_role: state
      last_read_at:
        range: datetime
        description: Data time of the last read.
        annotations:
          dta_role: state

  TwinSyncRun:
    description: One execution of the sync pipeline.
    annotations:
      dta_event: true
    attributes:
      uid:
        identifier: true
        required: true
      kind:
        range: TwinRunKind
        description: Whether the run loaded existing history or new data.
      finished_at:
        range: datetime
        description: Data time at which the run ended.
      duration_ms:
        range: integer
        minimum_value: 0
        description: How long the run took on the wall clock.
      versions_written:
        range: integer
        minimum_value: 0
      rejects_location:
        description: Path inside the artifact volume of the rows set aside by validation.
      unmapped_columns:
        multivalued: true
        description: Source columns the run saw that no mapping reads, as source.dataset.column.
      started_at:
        range: datetime
        required: true
        description: Data time at which the run began.
      watermark:
        range: datetime
        description: Latest data timestamp the run saw.
      status:
        range: TwinRunStatus
        required: true
      sources:
        multivalued: true
        description: Ids of the sources read in this run.
      rows_read:
        range: integer
        minimum_value: 0
      rows_written:
        range: integer
        minimum_value: 0
      rows_rejected:
        range: integer
        minimum_value: 0
      error:
        annotations:
          dta_long: true
      trace_id: {}

  TwinArtifact:
    description: A file kept outside the graph and referenced by its content hash.
    attributes:
      uid:
        identifier: true
        required: true
      sha256:
        required: true
        pattern: "^[0-9a-f]{64}$"
      media_type:
        required: true
      size_bytes:
        range: integer
        required: true
        minimum_value: 0
      location:
        required: true
        description: Path inside the twin's artifact volume.
      description: {}

enums:
  TwinSourceStatus:
    permissible_values:
      ok: {}
      failing: {}
      disabled: {}
  TwinRunKind:
    permissible_values:
      backfill: {}
      incremental: {}
  TwinRunStatus:
    permissible_values:
      running: {}
      succeeded: {}
      failed: {}
