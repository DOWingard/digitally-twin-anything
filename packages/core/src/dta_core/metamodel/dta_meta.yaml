id: https://w3id.org/dta/meta
name: dta_meta
description: >-
  Types present in every twin. They record the twin's own configuration and
  activity as objects of the graph, so the commit history covers them too.
  A domain ontology must not define a class whose name starts with Twin.
prefixes:
  linkml: https://w3id.org/linkml/
  dta: https://w3id.org/dta/meta/
default_prefix: dta
default_range: string
imports:
  - linkml:types

classes:
  TwinManifest:
    description: >-
      The manifest the twin was built from. There is one such object; each
      revision of the manifest is a new version of it.
    attributes:
      uid:
        identifier: true
        required: true
      twin_id:
        required: true
      name: {}
      tier: {}
      revision:
        range: integer
        required: true
        minimum_value: 1
      manifest_hash:
        required: true
        pattern: "^[0-9a-f]{64}$"
      contract_hash:
        required: true
        pattern: "^[0-9a-f]{64}$"
      content:
        required: true
        description: The whole manifest as YAML.
        annotations:
          dta_long: true

  TwinSource:
    description: A data source the twin reads.
    attributes:
      uid:
        identifier: true
        required: true
      connector:
        required: true
        description: How the source is read (file, sql, http, custom).
      description: {}
      location:
        description: Address of the source with placeholders in place of anything secret.
        annotations:
          dta_long: true
      watermark:
        range: datetime
        description: Latest data timestamp read from the source.
        annotations:
          dta_role: state
      status:
        range: TwinSourceStatus
        required: true
        annotations:
          dta_role: state
      last_success_at:
        range: datetime
        description: Data time of the last successful read.
        annotations:
          dta_role: state
      last_error:
        annotations:
          dta_role: state
          dta_long: true

  TwinDataset:
    description: One dataset of a source and how far the twin has read it.
    attributes:
      uid:
        identifier: true
        required: true
      source:
        range: TwinSource
        required: true
      name:
        required: true
      cursor_column: {}
      cursor:
        description: Highest value of the cursor column read so far, as text.
        annotations:
          dta_role: state
      rows_read:
        range: integer
        minimum_value: 0
        description: Rows read from the dataset since the twin was installed.
        annotations:
          dta_role: state
      last_read_at:
        range: datetime
        description: Data time of the last read.
        annotations:
          dta_role: state

  TwinSyncRun:
    description: One execution of the sync pipeline.
    annotations:
      dta_event: true
    attributes:
      uid:
        identifier: true
        required: true
      kind:
        range: TwinRunKind
        description: >-
          Whether the run loaded existing history, took new data, or read a
          dataset again whole.
      finished_at:
        range: datetime
        description: Data time at which the run ended.
      duration_ms:
        range: integer
        minimum_value: 0
        description: How long the run took on the wall clock.
      versions_written:
        range: integer
        minimum_value: 0
      rejects_location:
        description: Path inside the artifact volume of the rows set aside by validation.
      unmapped_columns:
        multivalued: true
        description: Source columns the run saw that no mapping reads, as source.dataset.column.
      started_at:
        range: datetime
        required: true
        description: Data time at which the run began.
      watermark:
        range: datetime
        description: Latest data timestamp the run saw.
      status:
        range: TwinRunStatus
        required: true
      sources:
        multivalued: true
        description: Ids of the sources read in this run.
      rows_read:
        range: integer
        minimum_value: 0
      rows_written:
        range: integer
        minimum_value: 0
      rows_rejected:
        range: integer
        minimum_value: 0
      rows_late:
        range: integer
        minimum_value: 0
        description: Rows that arrived behind the cursor of their series and were not written.
      clock_at:
        range: datetime
        description: >-
          Time the twin's clock gave when the run began; only intervals that
          had ended by then were taken. Not set by a load of existing history.
      error:
        annotations:
          dta_long: true
      trace_id: {}

  TwinArtifact:
    description: A file kept outside the graph and referenced by its content hash.
    attributes:
      uid:
        identifier: true
        required: true
      sha256:
        required: true
        pattern: "^[0-9a-f]{64}$"
      media_type:
        required: true
      size_bytes:
        range: integer
        required: true
        minimum_value: 0
      location:
        required: true
        description: Path inside the twin's artifact volume.
      description: {}

  TwinFunction:
    description: >-
      Something the twin computes on request or on a schedule: shipped with the
      runtime, or registered as code that runs apart from the API.
    attributes:
      uid:
        identifier: true
        required: true
      kind:
        range: TwinFunctionKind
        required: true
      entry:
        required: true
        description: Name of a built-in, or module:function inside the code artifact.
      artifact:
        range: TwinArtifact
        description: The code of a registered function.
      description:
        annotations:
          dta_long: true
      params:
        description: Fixed arguments, as JSON.
        annotations:
          dta_long: true
      arguments:
        description: What a caller may pass, as a JSON Schema.
        annotations:
          dta_long: true
      complexity:
        description: Cost in objects, links and versions, such as O(|E|).
      latency_budget_ms:
        range: integer
        minimum_value: 1
        description: Longest acceptable run time; a run that exceeds it is stopped.
      trigger:
        range: TwinFunctionTrigger
        required: true
      interval:
        description: Period when the trigger is interval, ISO 8601.
      env:
        multivalued: true
        description: Names of the environment variables registered code may read.
      origin:
        range: TwinOrigin
        required: true
      status:
        range: TwinFunctionStatus
        required: true
        annotations:
          dta_role: state

  TwinFunctionRun:
    description: >-
      One run of a function that was scheduled or that wrote to the twin. A run
      on request that only answers leaves no record.
    annotations:
      dta_event: true
    attributes:
      uid:
        identifier: true
        required: true
      function:
        range: TwinFunction
        required: true
      trigger:
        range: TwinFunctionTrigger
        required: true
      status:
        range: TwinWorkStatus
        required: true
      started_at:
        range: datetime
        required: true
        description: Data time of the version the run read.
      at_version:
        required: true
        description: Commit the run read.
      params:
        description: Arguments of the run, as JSON.
        annotations:
          dta_long: true
      rows_written:
        range: integer
        minimum_value: 0
      duration_ms:
        range: integer
        minimum_value: 0
      error:
        annotations:
          dta_long: true
      trace_id: {}

  TwinModel:
    description: >-
      One candidate of a model specification: a family with its settings, and,
      once fitted, the fitted state it predicts from.
    attributes:
      uid:
        identifier: true
        required: true
      spec:
        required: true
        description: Id of the model specification the candidate belongs to.
      candidate:
        required: true
      family:
        required: true
        description: Name of a shipped family, or module:name inside the code artifact.
      code:
        range: TwinArtifact
        description: The code of a registered family.
      params:
        description: Settings of the family, as JSON.
        annotations:
          dta_long: true
      question:
        description: Id of the question the model answers.
      target:
        required: true
        description: What is predicted, as Type.property.
      features:
        multivalued: true
      interventional:
        range: boolean
        required: true
        description: Whether its predictions hold when a control is changed.
      origin:
        range: TwinOrigin
        required: true
      status:
        range: TwinModelStatus
        required: true
        annotations:
          dta_role: state
      fitted:
        range: TwinArtifact
        description: The fitted state.
        annotations:
          dta_role: state
      fitted_from:
        range: datetime
        description: Data time the training data begins.
        annotations:
          dta_role: state
      fitted_to:
        range: datetime
        description: Data time the training data ends.
        annotations:
          dta_role: state
      fitted_at_version:
        description: Commit the training data was read at.
        annotations:
          dta_role: state
      validity:
        description: Range of every input seen in training, as JSON.
        annotations:
          dta_role: state
          dta_long: true

  TwinBacktest:
    description: One walk-forward evaluation of a model against what was observed later.
    annotations:
      dta_event: true
    attributes:
      uid:
        identifier: true
        required: true
      model:
        range: TwinModel
        required: true
      started_at:
        range: datetime
        required: true
        description: Data time of the version the evaluation read.
      at_version:
        required: true
        description: Commit the evaluation read.
      range_from:
        range: datetime
        required: true
      range_to:
        range: datetime
        required: true
      origins:
        range: integer
        required: true
        minimum_value: 0
        description: Number of forecast origins evaluated.
      horizon_steps:
        range: integer
        required: true
        minimum_value: 1
      step:
        required: true
        description: Time between two predicted values, ISO 8601.
      refit_every:
        range: integer
        minimum_value: 0
        description: Origins between two fits; 0 when the model was fitted once.
      metric:
        required: true
      error:
        range: float
        description: The metric over all origins.
      baseline:
        description: The naive forecast the model is compared with.
      baseline_error:
        range: float
      threshold:
        range: float
        description: Largest error accepted.
      accepted:
        range: boolean
        required: true
      scores:
        description: Every metric computed, per model and baseline, as JSON.
        annotations:
          dta_long: true
      residuals:
        range: TwinArtifact
        description: Quantiles of the errors per step ahead, used for intervals.
      duration_ms:
        range: integer
        minimum_value: 0
      trace_id: {}

  TwinQuestion:
    description: >-
      A question of the contract as the twin answers it now: how, and with what
      measured error against the agreed tolerance.
    attributes:
      uid:
        identifier: true
        required: true
      question:
        required: true
        description: Id of the question in the contract.
      status:
        range: TwinQuestionStatus
        required: true
        annotations:
          dta_role: state
      reason:
        description: Why the question is provisional or failing.
        annotations:
          dta_role: state
          dta_long: true
      metric:
        annotations:
          dta_role: state
      measured_error:
        range: float
        annotations:
          dta_role: state
      tolerance:
        range: float
        annotations:
          dta_role: state
      unit:
        annotations:
          dta_role: state
      basis:
        range: TwinQuestionBasis
        description: What the measured error rests on.
        annotations:
          dta_role: state
      backtest:
        range: TwinBacktest
        annotations:
          dta_role: state
      function:
        range: TwinFunction
        annotations:
          dta_role: state
      model:
        range: TwinModel
        annotations:
          dta_role: state
      measured_at:
        range: datetime
        description: Data time of the version the error was measured at.
        annotations:
          dta_role: state

  TwinScenario:
    description: >-
      A what-if: a branch that starts at a version of the live line, holds
      assumed changes, and is filled with what a model predicts follows.
    attributes:
      uid:
        identifier: true
        required: true
      name:
        required: true
      description:
        annotations:
          dta_long: true
      branch:
        required: true
      base_version:
        required: true
        description: Commit of the live line the scenario starts from.
      base_t:
        range: datetime
        required: true
        description: Data time of that version.
      interventions:
        required: true
        description: The assumed changes, as JSON.
        annotations:
          dta_long: true
      horizon:
        description: How far the scenario runs beyond its base, ISO 8601.
      step:
        description: Step of the scenario's grid, ISO 8601.
      models:
        multivalued: true
        description: Uids of the models that predict what follows, one per predicted property.
      status:
        range: TwinScenarioStatus
        required: true
        annotations:
          dta_role: state
      error:
        annotations:
          dta_role: state
          dta_long: true

  TwinFidelity:
    description: >-
      Whether the twin keeps what it promised: one record, changed at every
      transition.
    attributes:
      uid:
        identifier: true
        required: true
      state:
        range: TwinFidelityState
        required: true
        annotations:
          dta_role: state
      since:
        range: datetime
        description: Data time of the check at which the state began.
        annotations:
          dta_role: state
      check:
        description: Uid of the last check.
        annotations:
          dta_role: state

  TwinFidelityCheck:
    description: >-
      One fidelity check: what was measured at a time of the twin's clock.
    annotations:
      dta_event: true
    attributes:
      uid:
        identifier: true
        required: true
      at:
        range: datetime
        required: true
        description: The check time, on the twin's clock.
      at_version:
        required: true
        description: Commit the check read.
      state:
        range: TwinFidelityState
        required: true
        description: The twin's state after the check.
      questions:
        description: >-
          Per question, as JSON: the origin scored, its error, the window error
          and its number of origins, the warning sum, per series the mean signed
          residual and the last predicted value, and why nothing was scored.
        annotations:
          dta_long: true
      freshness:
        description: Per question and source, as JSON.
        annotations:
          dta_long: true
      signals:
        description: What the data-quality tests found, as JSON.
        annotations:
          dta_long: true
      coverage:
        description: Questions validated, provisional and failing; rows set aside; as JSON.
        annotations:
          dta_long: true
      duration_ms:
        range: integer
        minimum_value: 0
      trace_id: {}

  TwinIncident:
    description: >-
      Something that keeps the twin from its promises, from when it was found
      until it was put right or given up on.
    attributes:
      uid:
        identifier: true
        required: true
      kind:
        range: TwinIncidentKind
        required: true
      subject:
        required: true
        description: Id of the question, or uid of the signal or the action record.
      status:
        range: TwinIncidentStatus
        required: true
        annotations:
          dta_role: state
      opened_at:
        range: datetime
        required: true
      opened_version:
        required: true
      resolved_at:
        range: datetime
        annotations:
          dta_role: state
      rung:
        range: integer
        minimum_value: 0
        maximum_value: 4
        annotations:
          dta_role: state
      attempt:
        range: integer
        minimum_value: 0
        annotations:
          dta_role: state
      cycle:
        range: integer
        minimum_value: 0
        annotations:
          dta_role: state
      awaiting:
        range: datetime
        description: >-
          End of the data a model put in place by a correction was fitted on:
          the incident waits for origins after it.
        annotations:
          dta_role: state
      requested_at:
        range: datetime
        description: When a re-model was asked for.
        annotations:
          dta_role: state
      detail:
        description: What was measured at the opening and now, as JSON.
        annotations:
          dta_role: state
          dta_long: true
      steps:
        description: Every step taken, in order, as JSON.
        annotations:
          dta_role: state
          dta_long: true

  TwinSignal:
    description: >-
      One observed property of one object whose readings the twin tests, kept
      once it was found suspect.
    attributes:
      uid:
        identifier: true
        required: true
      property:
        required: true
        description: Type.property.
      object:
        required: true
        description: Uid of the object.
      status:
        range: TwinSignalStatus
        required: true
        annotations:
          dta_role: state
      reason:
        range: TwinSignalReason
        annotations:
          dta_role: state
      since:
        range: datetime
        annotations:
          dta_role: state
      value_at_flag:
        description: The reading when it was flagged, as JSON.
        annotations:
          dta_role: state
      reading:
        description: The newest reading of the source, as JSON; not written to the object while suspect.
        annotations:
          dta_role: state
      reading_at:
        range: datetime
        annotations:
          dta_role: state
      clear_checks:
        range: integer
        minimum_value: 0
        description: Consecutive checks in which the reading looked sound again.
        annotations:
          dta_role: state
      detail:
        description: The test's numbers, as JSON.
        annotations:
          dta_role: state
          dta_long: true

  TwinAction:
    description: A type of action on the real system, as the manifest declares it.
    attributes:
      uid:
        identifier: true
        required: true
      description:
        annotations:
          dta_long: true
      control:
        description: Id of the delegated control it carries out.
      target:
        description: Type.property the control sets.
      object_type: {}
      binding:
        range: TwinActionBinding
        required: true
      autonomy:
        range: TwinAutonomy
        description: Of its control; advisory when it carries out none.
      parameters:
        description: Its arguments, as JSON.
        annotations:
          dta_long: true
      bounds:
        description: The control's bounds, as JSON.
        annotations:
          dta_long: true
      executor:
        description: The external call, as JSON; names of variables, never their values.
        annotations:
          dta_long: true
      settle:
        description: Time after which its effect must be observable, ISO 8601.
      tolerance:
        range: float
      precondition:
        annotations:
          dta_long: true
      expected_effect:
        annotations:
          dta_long: true
      origin:
        range: TwinOrigin
      status:
        range: TwinFunctionStatus
        required: true
        annotations:
          dta_role: state

  TwinActionRecord:
    description: >-
      One proposed action and what became of it: refused, approved, blocked,
      executed, and whether its effect was then observed.
    attributes:
      uid:
        identifier: true
        required: true
      action:
        range: TwinAction
        required: true
      object:
        required: true
        description: Uid of the object acted on.
      params:
        required: true
        description: Its arguments, as JSON.
        annotations:
          dta_long: true
      reason:
        annotations:
          dta_long: true
      source:
        required: true
        description: >-
          Who proposed it: a name, or the uid of a control loop.
      proposed_at:
        range: datetime
        required: true
      at_version:
        required: true
        description: Commit the proposal was judged at.
      fidelity:
        range: TwinFidelityState
        description: The twin's state when it was judged.
      status:
        range: TwinActionStatus
        required: true
        annotations:
          dta_role: state
      reasons:
        description: Why it was rejected or blocked, as JSON.
        annotations:
          dta_role: state
          dta_long: true
      approval:
        description: Who approved or rejected it, when and with what note, as JSON.
        annotations:
          dta_role: state
          dta_long: true
      execution:
        description: >-
          When it was sent and took effect, the answer's status and an excerpt,
          the duration, as JSON.
        annotations:
          dta_role: state
          dta_long: true
      effective_at:
        range: datetime
        annotations:
          dta_role: state
      reconciliation:
        range: TwinReconciliation
        annotations:
          dta_role: state
      observed:
        description: What was observed when it was reconciled, as JSON.
        annotations:
          dta_role: state
      reconciled_at:
        range: datetime
        annotations:
          dta_role: state

  TwinControlLoop:
    description: A loop that asks a policy function what to do, on an interval.
    attributes:
      uid:
        identifier: true
        required: true
      description:
        annotations:
          dta_long: true
      controls:
        multivalued: true
        description: Ids of the delegated controls it drives.
      policy:
        range: TwinFunction
        required: true
      interval:
        required: true
        description: Time between decisions, ISO 8601.
      origin:
        range: TwinOrigin
      status:
        range: TwinFunctionStatus
        required: true
        annotations:
          dta_role: state
      enabled:
        range: boolean
        required: true
        annotations:
          dta_role: state
      last_run_at:
        range: datetime
        annotations:
          dta_role: state
      last_run:
        description: >-
          What the last run did: proposed, executed, blocked and rejected
          actions, its notes or its error, as JSON.
        annotations:
          dta_role: state
          dta_long: true

enums:
  TwinFunctionKind:
    permissible_values:
      builtin: {}
      registered: {}
  TwinFunctionTrigger:
    permissible_values:
      on_request: {}
      on_commit: {}
      interval: {}
  TwinFunctionStatus:
    permissible_values:
      active: {}
      disabled: {}
  TwinOrigin:
    permissible_values:
      manifest:
        description: Declared in the manifest and registered when the twin was built.
      runtime:
        description: Registered through the API while the twin ran.
  TwinWorkStatus:
    permissible_values:
      succeeded: {}
      failed: {}
  TwinModelStatus:
    permissible_values:
      candidate:
        description: Registered; not evaluated yet, or evaluated and not chosen.
      active:
        description: The model its question is answered with.
      rejected:
        description: Evaluated and outside what was agreed.
      retired: {}
  TwinQuestionStatus:
    permissible_values:
      validated:
        description: Measured error within the agreed tolerance.
      provisional:
        description: Answered, but not yet measured well enough to say.
      failing:
        description: Measured error outside the agreed tolerance.
  TwinQuestionBasis:
    permissible_values:
      backtest:
        description: Walk-forward evaluation of the question's model.
      noise_floor:
        description: Noise of the source columns the answer is read from.
      check:
        description: The function's own check of its answer.
      latency:
        description: Only that the function answers within its budget.
  TwinScenarioStatus:
    permissible_values:
      created: {}
      running: {}
      done: {}
      failed: {}
      deleted: {}
  TwinSourceStatus:
    permissible_values:
      ok: {}
      failing: {}
      disabled: {}
  TwinRunKind:
    permissible_values:
      backfill: {}
      incremental: {}
      replay: {}
  TwinRunStatus:
    permissible_values:
      running: {}
      succeeded: {}
      partial:
        description: Some sources failed; the others were synced.
      failed: {}
  TwinFidelityState:
    permissible_values:
      unknown:
        description: No check has completed.
      healthy: {}
      correcting:
        description: Something is being put right; nothing is given up on.
      failed:
        description: The twin could not put itself right; automated action is suspended.
  TwinIncidentKind:
    permissible_values:
      breach:
        description: A question's error is outside its tolerance.
      stale:
        description: A question's data is older than agreed.
      signal:
        description: An observed signal is suspect.
      reconcile:
        description: An executed action did not have its effect.
  TwinIncidentStatus:
    permissible_values:
      open: {}
      remodel_requested:
        description: The managing agent was asked for other models.
      failed: {}
      resolved: {}
  TwinSignalStatus:
    permissible_values:
      suspect: {}
      ok: {}
  TwinSignalReason:
    permissible_values:
      stuck: {}
      biased: {}
  TwinActionBinding:
    permissible_values:
      advisory: {}
      executor: {}
  TwinAutonomy:
    permissible_values:
      advisory: {}
      supervised: {}
      autonomous: {}
  TwinActionStatus:
    permissible_values:
      proposed: {}
      rejected: {}
      approved: {}
      blocked: {}
      executed: {}
      failed: {}
  TwinReconciliation:
    permissible_values:
      pending: {}
      ok: {}
      mismatch: {}
