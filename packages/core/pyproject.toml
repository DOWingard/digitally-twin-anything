[project]
name = "dta-core"
version = "0.1.0"
description = "Shared library: logging, configuration, manifest models"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "linkml-runtime>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dta_core"]
