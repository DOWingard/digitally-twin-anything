[project]
name = "dta-core"
version = "0.1.0"
description = "Shared library: logging, configuration, manifest models"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

# The base install holds logging, configuration, errors, the manifest and the
# ontology descriptors, so that a small service can share them without the
# libraries the larger parts need.
[project.optional-dependencies]
ontology = [
    "linkml-runtime>=1.9",
    "linkml>=1.9",
    # What jsonschema checks URI and IRI formats with when rfc3987 is not installed
    # (the workspace never installs it).
    "rfc3986-validator>=0.1.1",
    "rfc3987-syntax>=1.1",
]
store = [
    "pymysql>=1.1",
    "pyarrow>=17",
    "sqlalchemy>=2.0",
]
sources = [
    "dlt[sql-database]>=1.20",
    "fsspec>=2024.10",
    "aiohttp>=3.10",
    "psycopg2-binary>=2.9",
    "numpy>=2.0",
    "pyarrow>=17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dta_core"]
